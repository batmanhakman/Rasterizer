name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build native viewer and renderer
        run: cmake --build build --config Release --parallel
      - name: Test loading, depth, textures, and bundled assets
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package executable and assets
        working-directory: build
        run: cpack -C Release
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: Rasterizer-${{ runner.os }}
          path: build/*.zip
          if-no-files-found: error
